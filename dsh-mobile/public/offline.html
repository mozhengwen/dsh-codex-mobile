<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151517">
<title>DSH Mobile · 已离线</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(900px 520px at 8% -10%,#263148,transparent 58%),#151517;color:#f5f6f7}
.card{max-width:420px;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#5686fe,#7aaaff);display:grid;place-items:center;color:#f5f6f7;font-weight:800;font-size:24px;letter-spacing:-.04em}
h1{font-size:23px;margin:0 0 10px}p{color:#cfd3d6;line-height:1.7;font-size:14px;margin:0 0 22px}
button{border:0;border-radius:10px;padding:13px 20px;background:#f5f6f7;color:#151517;font:inherit;font-weight:650;font-size:15px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">DSH</div>
  <h1>电脑暂时没有响应</h1>
  <p>请确认 DSH 桌面版仍在运行，且手机与电脑连接的是同一个 Wi-Fi。恢复后点下方按钮重试。</p>
  <button onclick="location.reload()">重新连接</button>
</main>
</body>
</html>
