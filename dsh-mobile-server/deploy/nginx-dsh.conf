map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}
limit_req_zone $binary_remote_addr zone=dsh_pairing:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dsh_requests:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=dsh_connections:10m;
log_format dsh_mobile_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    server_name relay.example.com;

    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/dsh-mobile-access.log dsh_mobile_safe;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn dsh_connections 32;
    limit_req zone=dsh_requests burst=100 nodelay;

    location ~ ^/(?:backends/codex/)?pair$ {
        limit_req zone=dsh_pairing burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dsh_tls:10m;
    ssl_session_timeout 1d;
}

server {
    if ($host = relay.example.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    return 404;
}

