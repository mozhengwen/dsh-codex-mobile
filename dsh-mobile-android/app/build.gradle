plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

// Maintainer credentials live outside the source tree. Contributors can use
// their own properties file; without it assembleRelease produces an unsigned APK.
def privateSigning = new Properties()
def privateSigningFile = new File(System.getenv('DSH_SIGNING_PROPERTIES') ?: new File(System.getProperty('user.home'), '.dsh-mobile/signing/dsh-mobile-release.properties').path)
if (privateSigningFile.isFile()) privateSigningFile.withInputStream { privateSigning.load(it) }
def releaseStorePath = System.getenv('DSH_KEYSTORE_FILE') ?: privateSigning.getProperty('storeFile')
def releaseStorePassword = System.getenv('DSH_KEYSTORE_PASSWORD') ?: privateSigning.getProperty('storePassword')
def releaseKeyAlias = System.getenv('DSH_KEY_ALIAS') ?: privateSigning.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('DSH_KEY_PASSWORD') ?: privateSigning.getProperty('keyPassword')
def hasPrivateSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStorePath).isFile()

android {
  namespace 'com.local.dshmobile'
  compileSdk 35

  defaultConfig {
    applicationId 'com.local.dshmobile'
    minSdk 26
    targetSdk 34
    versionCode 11
    versionName '0.7.2'
  }

  signingConfigs {
    if (hasPrivateSigning) {
      release {
        storeFile file(releaseStorePath)
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.preview'
      versionNameSuffix '-preview'
    }
    release {
      minifyEnabled false
      shrinkResources false
      if (hasPrivateSigning) signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  packaging {
    resources {
      excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
    }
  }
}

configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
  }
}

dependencies {
  implementation platform('androidx.compose:compose-bom:2024.12.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

  debugImplementation 'androidx.compose.ui:ui-tooling'
  testImplementation 'junit:junit:4.13.2'
}

